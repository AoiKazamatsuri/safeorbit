name: safeorbit
services:
  database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeorbit}
      POSTGRES_USER: ${POSTGRES_USER:-safeorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node ../dev/setup-env.mjs first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - care-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-safeorbit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-safeorbit}
      POSTGRES_USER: ${POSTGRES_USER:-safeorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node ../dev/setup-env.mjs first}
      # Apple push (T38): ids from server/.env; the .p8 key file is mounted read-only. Without APNS_KEY_PATH an
      # empty /dev/null is mounted and the server records notifications as not configured.
      APNS_KEY_PATH: ${APNS_KEY_PATH:+/run/secrets/apns-key.p8}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-org.safeorbit.demo}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-development}
    volumes:
      - ${APNS_KEY_PATH:-/dev/null}:/run/secrets/apns-key.p8:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  care-data:
